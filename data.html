<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raw Data Table</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <a href="index.html">Habit Dashboard</a>
  </div>

  <div class="header-right">
    <span id="userEmail"></span>
    <button id="darkModeToggle">🌙 Dark Mode</button>
    <button id="logoutBtn">Log out</button>
  </div>
</header>


<section>
  <h2>Raw Habit Data</h2>
  <p style="opacity:0.7; font-size:0.9rem;">
    Read-only view of all recorded entries. One row per day.
  </p>

  <div class="daily-list-container" style="max-height: 70vh;">
    <table class="daily-table" id="rawDataTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Overall</th>
          <th>Energy</th>
          <th>Mental</th>
          <th>Physical</th>

          <th>Time Up</th>
          <th>Time In Bed</th>

          <th>Work (hrs)</th>
          <th>Personal (hrs)</th>

          <th>Workout</th>
          <th>Journal</th>
          <th>Read</th>
          <th>Drink</th>
          <th>Low Media</th>
          <th>Piano</th>
          <th>Office</th>
          <th>Hit Goal</th>

          <th>Keyword</th>
          <th>Summary</th>
        </tr>
      </thead>
      <tbody id="rawDataBody"></tbody>
    </table>
  </div>
</section>

<!-- =========================
     SCRIPTS (same order)
========================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

<script>
  function safe(v) {
    return v == null ? "" : v;
  }

  function renderRawTable() {
    // 🔁 CHANGE THIS if your global array name differs
    const data = window.allData;

    if (!Array.isArray(data)) {
      console.warn("Raw data not found (window.allData)");
      return;
    }

    const tbody = document.getElementById("rawDataBody");
    tbody.innerHTML = "";

    data.forEach(d => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${safe(d.date)}</td>

        <td>${safe(d.overallFeeling)}</td>
        <td>${safe(d.energyFeeling)}</td>
        <td>${safe(d.mentalFeeling)}</td>
        <td>${safe(d.physicalFeeling)}</td>

        <td>${safe(d.timeUpHours)}</td>
        <td>${safe(d.timeInBedHours)}</td>

        <td>${safe(d.workHours)}</td>
        <td>${safe(d.personalHours)}</td>

        <td>${d.workoutYes ? "✓" : ""}</td>
        <td>${d.journalYes ? "✓" : ""}</td>
        <td>${d.readYes ? "✓" : ""}</td>
        <td>${d.drinkYes ? "✓" : ""}</td>
        <td>${d.mediaYes ? "✓" : ""}</td>
        <td>${d.pianoYes ? "✓" : ""}</td>
        <td>${d.officeYes ? "✓" : ""}</td>
        <td>${d.goalYes ? "✓" : ""}</td>

        <td>${safe(d.dailyKeyword)}</td>
        <td>${safe(d.dailySummary)}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function waitForRawData() {
  if (!Array.isArray(window.allData)) {
    setTimeout(waitForRawData, 100);
    return;
  }
  renderRawTable();
}

waitForRawData();

</script>
<!-- =========================
     Mobile Bottom Navigation
========================= -->
<nav class="bottom-nav">
  <a href="index.html">Dashboard</a>
  <a href="input.html">Input</a>
  <a href="data.html" class="active">Data</a>
</nav>


</body>
</html>
