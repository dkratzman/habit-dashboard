<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raw Data Table</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <a href="index.html">Habit Dashboard</a>
  </div>

  <div class="header-right">
    <span id="userEmail"></span>
  </div>
</header>

<div class="page-actions">
  <a href="index.html" class="btn-secondary">Back to Dashboard</a>
</div>

<section>
  <p style="opacity:0.7; font-size:0.9rem;">
    Read-only view of all recorded entries. One row per day.
  </p>

  <div class="daily-list-container" style="max-height: 70vh;">
    <table class="daily-table" id="rawDataTable">
      <thead>
        <tr id="rawDataHeaderRow">
          <th>Date</th>
          <th>Overall</th>
          <th>Energy</th>
          <th>Mental</th>
          <th>Physical</th>
          <th>Time Up</th>
          <th>Time In Bed</th>
          <th>Work (hrs)</th>
          <th>Personal (hrs)</th>
          <th>Keyword</th>
          <th>Summary</th>
        </tr>
      </thead>
      <tbody id="rawDataBody"></tbody>
    </table>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="theme.js"></script>
<script src="habitPreferences.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

<script>
  function safe(v) {
    return v == null ? "" : v;
  }

  function renderRawTable() {
    const data = window.allData;
    const habitDefs = typeof getEnabledHabitDefinitions === "function"
      ? getEnabledHabitDefinitions()
      : [];

    if (!Array.isArray(data)) {
      console.warn("Raw data not found (window.allData)");
      return;
    }

    const headerRow = document.getElementById("rawDataHeaderRow");
    if (headerRow) {
      headerRow.innerHTML = `
        <th>Date</th>
        <th>Overall</th>
        <th>Energy</th>
        <th>Mental</th>
        <th>Physical</th>
        <th>Time Up</th>
        <th>Time In Bed</th>
        <th>Work (hrs)</th>
        <th>Personal (hrs)</th>
        ${habitDefs.map(habit => `<th>${habit.label}</th>`).join("")}
        <th>Keyword</th>
        <th>Summary</th>
      `;
    }

    const tbody = document.getElementById("rawDataBody");
    tbody.innerHTML = "";

    data.forEach(d => {
      const habitCells = habitDefs
        .map(habit => `<td>${d[habit.dataKey] == null ? "N/A" : (d[habit.dataKey] ? "Yes" : "")}</td>`)
        .join("");

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${safe(d.date)}</td>
        <td>${safe(d.overallFeeling)}</td>
        <td>${safe(d.energyFeeling)}</td>
        <td>${safe(d.mentalFeeling)}</td>
        <td>${safe(d.physicalFeeling)}</td>
        <td>${safe(d.timeUpHours)}</td>
        <td>${safe(d.timeInBedHours)}</td>
        <td>${safe(d.hoursWorked)}</td>
        <td>${safe(d.hoursPersonal)}</td>
        ${habitCells}
        <td>${safe(d.dailyKeyword)}</td>
        <td>${safe(d.dailySummary)}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function waitForRawData() {
    if (!Array.isArray(window.allData)) {
      setTimeout(waitForRawData, 100);
      return;
    }
    renderRawTable();
  }

  waitForRawData();
</script>

  </a>
  <a href="input.html" aria-label="Input">
